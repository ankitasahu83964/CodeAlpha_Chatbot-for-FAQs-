<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart FAQ Chatbot with Voice Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-container">
    <h2> Smart FAQ Chatbot with Voice Assistant🤖</h2>

    <!-- Chat Box -->
    <div id="chatbox"></div>

    <!-- Input Area -->
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask your question...">

        <!-- Send Button -->
        <button onclick="sendMessage()">Send</button>

        <!-- 🎤 Voice Input Button -->
        <button onclick="startVoice()">🎤</button>

        <!-- 🌈 QUOTE -->
        <button onclick="showQuote()">🌈</button>

        <!-- 💡 SUGGEST -->
        <button onclick="suggestQuestions()">💡</button>
    </div>    
</div>

<script src="script.js"></script>

</body>
</html>
